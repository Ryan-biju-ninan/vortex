<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SepsisGuard - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-body">
    <div class="auth-container">
        <!-- Registration Form Card -->
        <div class="auth-card" id="reg-card">
            <div class="auth-header">
                <h2>New Patient Registration</h2>
                <p>Please fill in your details.</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="reg-age" required>
                    </div>
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" id="reg-dob" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="tel" id="reg-contact" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>

            <div class="auth-footer">
                <p>Already have an ID? <a href="login.html">Login here</a></p>
            </div>
        </div>

        <!-- Success overlay/card (Hidden initially) -->
        <div class="auth-card hidden" id="success-card">
            <div class="auth-header">
                <i class="fa-solid fa-check-circle success-icon"></i>
                <h2>Registration Successful!</h2>
                <p>Please save your credentials below.</p>
            </div>

            <div class="credentials-box">
                <div class="cred-item">
                    <span>Patient ID:</span>
                    <strong id="new-pid"></strong>
                </div>
                <div class="cred-item">
                    <span>Password:</span>
                    <strong id="new-pass"></strong>
                </div>
                <p class="warning-text"><i class="fa-solid fa-triangle-exclamation"></i> You will need these to login.
                </p>
            </div>

            <button id="btn-goto-login" class="btn btn-primary btn-block">Go to Login</button>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        const regForm = document.getElementById('register-form');
        const regCard = document.getElementById('reg-card');
        const successCard = document.getElementById('success-card');

        regForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('reg-name').value;
            const age = document.getElementById('reg-age').value;
            const dob = document.getElementById('reg-dob').value;
            const contact = document.getElementById('reg-contact').value;
            const email = document.getElementById('reg-email').value;

            // Register user
            const newUser = Auth.register(name, age, dob, contact, email);

            // Show success
            document.getElementById('new-pid').textContent = newUser.patientId;
            document.getElementById('new-pass').textContent = newUser.password;

            regCard.classList.add('hidden');
            successCard.classList.remove('hidden');
        });

        document.getElementById('btn-goto-login').addEventListener('click', () => {
            window.location.href = 'login.html';
        });
    </script>
</body>

</html>
